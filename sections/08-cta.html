<!-- ========================================================
     سکشن ۸: CTA (دعوت به اقدام)
     ======================================================== -->
<style>
:root{
  --vs-primary:#170C79; --vs-secondary:#0170B9; --vs-accent:#128BE0;
  --vs-cyan:#8ACBD0; --vs-cream:#EFE3CA; --vs-ink:#1D2327;
}
.vs-cta{padding:60px 24px 100px; background:#fff;
  font-family:'Vazirmatn','IRANSans',Tahoma,sans-serif; direction:rtl;}
.vs-cta__inner{max-width:1240px;margin:0 auto;}
.vs-cta__wrap{
  background:linear-gradient(135deg,var(--vs-primary) 0%,#0a0648 50%,var(--vs-secondary) 100%);
  border-radius:32px;
  padding:72px 48px; color:#fff;
  position:relative; overflow:hidden; text-align:center;
}
.vs-cta__wrap::before{
  content:""; position:absolute; inset:-50%;
  background:
    radial-gradient(circle at 30% 30%, rgba(138,203,208,.40), transparent 50%),
    radial-gradient(circle at 70% 70%, rgba(18,139,224,.50), transparent 50%);
  animation:vs-cta-spin 18s linear infinite;
  pointer-events:none;
}
@keyframes vs-cta-spin{to{transform:rotate(360deg);}}
.vs-cta__wrap > *{position:relative; z-index:1;}
.vs-cta__wrap h2{
  color:#fff; font-size:clamp(28px,3.4vw,44px); font-weight:800;
  margin:0 0 16px; line-height:1.4;
}
.vs-cta__wrap h2 em{font-style:normal; color:var(--vs-cyan);}
.vs-cta__wrap p{
  color:rgba(255,255,255,.9); font-size:18px; line-height:1.9;
  max-width:620px; margin:0 auto 32px;
}
.vs-cta__row{display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}
.vs-cta__btn{
  display:inline-flex; align-items:center; gap:10px;
  padding:16px 32px; border-radius:14px;
  font-weight:700; font-size:16px; text-decoration:none;
  transition:all .25s ease; cursor:pointer; border:none;
}
.vs-cta__btn--primary{
  background:#fff; color:var(--vs-primary);
  box-shadow:0 16px 36px rgba(0,0,0,.20);
}
.vs-cta__btn--primary:hover{transform:translateY(-2px); background:var(--vs-cream);}
.vs-cta__btn--ghost{
  background:rgba(255,255,255,.12); color:#fff;
  border:1.5px solid rgba(255,255,255,.30);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
}
.vs-cta__btn--ghost:hover{background:rgba(255,255,255,.22); border-color:#fff;}
.vs-cta__btn svg{width:18px;height:18px;}

@media (max-width:560px){
  .vs-cta__wrap{padding:48px 24px;}
}
</style>

<section class="vs-cta" id="contact">
  <div class="vs-cta__inner">
    <div class="vs-cta__wrap">
      <h2>آماده‌ای سایتی بسازی که واقعاً <em>می‌فروشد</em>؟</h2>
      <p>فقط چند دقیقه وقت بگذار برای یک مشاوره رایگان. ما به ایده‌ت گوش می‌دیم و راهکار دقیق پیشنهاد می‌دیم.</p>
      <div class="vs-cta__row">
        <a href="tel:+982100000000" class="vs-cta__btn vs-cta__btn--primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.37 1.9.72 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0122 16.92z" stroke-linecap="round" stroke-linejoin="round"/></svg>
          تماس فوری با کارشناس
        </a>
        <a href="https://wa.me/989000000000" class="vs-cta__btn vs-cta__btn--ghost">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.946C.16 5.335 5.495 0 12.05 0a11.817 11.817 0 018.413 3.488 11.824 11.824 0 013.48 8.414c-.003 6.555-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884a9.86 9.86 0 001.51 5.26l-.999 3.648 3.978-1.607z"/></svg>
          گفت‌و‌گو در واتساپ
        </a>
      </div>
    </div>
  </div>
</section>
