<!-- ========================================================
     سکشن ۴: چرا ویرا سئو - تب‌های تعاملی
     ویژگی‌ها: ۴ تب با محتوای متغیر + اتو-روتیشن
     ======================================================== -->
<style>
.vs-home-why{
  --vs-primary:#170C79; --vs-secondary:#0170B9; --vs-accent:#128BE0;
  --vs-cyan:#8ACBD0; --vs-cream:#EFE3CA; --vs-ink:#1D2327;

  padding:110px 24px; background:#fff;
  font-family:'Vazirmatn','IRANSans',Tahoma,sans-serif; direction:rtl; color:var(--vs-ink);
  position:relative; overflow:hidden;
}
.vs-home-why::before{
  content:""; position:absolute; top:10%; right:-100px;
  width:300px; height:300px; border-radius:50%;
  background:radial-gradient(circle, rgba(18,139,224,.15), transparent 70%);
  filter:blur(40px); pointer-events:none;
}
.vs-home-why__inner{max-width:1100px; margin:0 auto; position:relative;}

.vs-home-why__head{text-align:center; margin-bottom:56px;}
.vs-home-why__head .vs-eyebrow{
  display:inline-flex; align-items:center; gap:8px;
  background:rgba(23,12,121,.08); color:var(--vs-primary);
  border:1px solid rgba(23,12,121,.18);
  padding:8px 16px; border-radius:999px; font-size:14px; font-weight:600; margin-bottom:16px;
}
.vs-home-why__head .vs-eyebrow i{
  width:8px; height:8px; border-radius:50%; background:var(--vs-accent);
  box-shadow:0 0 0 4px rgba(18,139,224,.18); display:inline-block;
}
.vs-home-why__head h2{font-size:clamp(28px,3.4vw,46px); font-weight:800; margin:0; line-height:1.4;}
.vs-home-why__head h2 em{
  font-style:normal;
  background:linear-gradient(135deg,var(--vs-primary),var(--vs-accent));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  -webkit-text-fill-color:transparent;
}

/* Tabs */
.vs-home-why__tabs{
  display:flex; justify-content:center; gap:8px; flex-wrap:wrap;
  margin-bottom:40px;
}
.vs-home-why__tab{
  padding:12px 24px; border-radius:12px;
  background:rgba(23,12,121,.05); border:1px solid rgba(23,12,121,.10);
  font-family:inherit; font-size:14px; font-weight:700;
  color:#64748B; cursor:pointer; transition:all .25s ease;
}
.vs-home-why__tab:hover{color:var(--vs-primary); border-color:var(--vs-primary);}
.vs-home-why__tab.is-active{
  background:linear-gradient(135deg,var(--vs-primary),var(--vs-accent));
  color:#fff; border-color:transparent;
  box-shadow:0 8px 24px rgba(23,12,121,.25);
}

/* Panel */
.vs-home-why__panel{
  background:#fff; border:1px solid rgba(23,12,121,.10);
  border-radius:28px; padding:48px;
  box-shadow:0 16px 50px rgba(23,12,121,.08);
  display:grid; grid-template-columns:1fr 1fr; gap:48px; align-items:center;
  min-height:320px;
  transition:opacity .3s ease, transform .3s ease;
}
.vs-home-why__panel.is-changing{
  opacity:0; transform:translateY(10px);
}

.vs-home-why__panel-content h3{
  font-size:26px; font-weight:800; margin:0 0 14px; color:var(--vs-ink);
}
.vs-home-why__panel-content p{
  font-size:16px; line-height:1.9; color:#475569; margin:0 0 24px;
}
.vs-home-why__panel-list{
  list-style:none; padding:0; margin:0; display:grid; gap:12px;
}
.vs-home-why__panel-list li{
  display:flex; align-items:flex-start; gap:10px;
  font-size:15px; color:var(--vs-ink);
}
.vs-home-why__panel-list li svg{flex-shrink:0; color:var(--vs-accent); margin-top:3px;}

/* Visual */
.vs-home-why__panel-visual{
  display:grid; place-items:center;
  aspect-ratio:1/1; max-width:280px; margin:0 auto;
  position:relative;
}
.vs-home-why__panel-visual .circle{
  position:absolute; border-radius:50%;
  border:2px solid rgba(23,12,121,.10);
}
.vs-home-why__panel-visual .circle--1{inset:0; animation:vs-home-why-spin 20s linear infinite;}
.vs-home-why__panel-visual .circle--2{inset:18%; border-style:dashed; animation:vs-home-why-spin 15s linear infinite reverse;}
@keyframes vs-home-why-spin{to{transform:rotate(360deg);}}
.vs-home-why__panel-visual .core{
  width:50%; aspect-ratio:1/1; border-radius:50%;
  background:linear-gradient(135deg,var(--vs-primary),var(--vs-accent));
  display:grid; place-items:center; color:#fff;
  box-shadow:0 0 40px rgba(18,139,224,.30);
  position:relative; z-index:1;
}
.vs-home-why__panel-visual .core svg{width:40%; height:40%;}

/* Progress bar */
.vs-home-why__progress{
  margin-top:24px; display:flex; justify-content:center; gap:6px;
}
.vs-home-why__progress-dot{
  width:8px; height:8px; border-radius:50%;
  background:rgba(23,12,121,.15); border:none; padding:0;
  cursor:pointer; transition:all .3s ease;
}
.vs-home-why__progress-dot.is-on{
  background:linear-gradient(135deg,var(--vs-primary),var(--vs-accent));
  width:28px; border-radius:5px;
}

@media (max-width:880px){
  .vs-home-why__panel{grid-template-columns:1fr; padding:32px 24px;}
  .vs-home-why__panel-visual{order:-1; max-width:200px;}
}
</style>

<section class="vs-home-why">
  <div class="vs-home-why__inner">
    <div class="vs-home-why__head">
      <span class="vs-eyebrow"><i></i>چرا ویرا سئو</span>
      <h2>دلایلی که ما را از بقیه <em>متفاوت</em> می‌کند</h2>
    </div>

    <div class="vs-home-why__tabs" data-vs-home-why-tabs>
      <button class="vs-home-why__tab is-active" data-tab="1">تجربه و تخصص</button>
      <button class="vs-home-why__tab" data-tab="2">شفافیت و اعتماد</button>
      <button class="vs-home-why__tab" data-tab="3">پشتیبانی حرفه‌ای</button>
      <button class="vs-home-why__tab" data-tab="4">نتایج تضمینی</button>
    </div>

    <div class="vs-home-why__panel" data-vs-home-why-panel>
      <div class="vs-home-why__panel-content">
        <h3 data-panel-title>تجربه و تخصص</h3>
        <p data-panel-desc>بیش از ۱۰ سال تجربه در حوزه دیجیتال مارکتینگ و بیش از ۴۵۰ پروژه موفق. تیم ما متشکل از متخصصین باتجربه در طراحی، سئو و برنامه‌نویسی است.</p>
        <ul class="vs-home-why__panel-list" data-panel-list>
          <li><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>بیش از ۱۰ سال سابقه حرفه‌ای</li>
          <li><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>۴۵۰+ پروژه موفق تحویل‌داده‌شده</li>
          <li><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>تیم متخصص و به‌روز</li>
        </ul>
      </div>
      <div class="vs-home-why__panel-visual">
        <div class="circle circle--1"></div>
        <div class="circle circle--2"></div>
        <div class="core" data-panel-icon>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
    </div>

    <div class="vs-home-why__progress" data-vs-home-why-dots></div>
  </div>
</section>

<script>
(function(){
  const tabs = document.querySelectorAll('[data-vs-home-why-tabs] .vs-home-why__tab');
  const panel = document.querySelector('[data-vs-home-why-panel]');
  const dotsHost = document.querySelector('[data-vs-home-why-dots]');
  if(!tabs.length || !panel) return;

  const data = {
    1: {
      title:'تجربه و تخصص',
      desc:'بیش از ۱۰ سال تجربه در حوزه دیجیتال مارکتینگ و بیش از ۴۵۰ پروژه موفق. تیم ما متشکل از متخصصین باتجربه در طراحی، سئو و برنامه‌نویسی است.',
      list:['بیش از ۱۰ سال سابقه حرفه‌ای','۴۵۰+ پروژه موفق تحویل‌داده‌شده','تیم متخصص و به‌روز'],
      icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    },
    2: {
      title:'شفافیت و اعتماد',
      desc:'قیمت‌گذاری شفاف بدون هزینه‌های پنهان. گزارش‌دهی هفتگی از پیشرفت پروژه و دسترسی مستقیم به تیم در هر لحظه.',
      list:['قیمت‌گذاری شفاف و مشخص','گزارش هفتگی پیشرفت پروژه','بدون هزینه‌های پنهان'],
      icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'
    },
    3: {
      title:'پشتیبانی حرفه‌ای',
      desc:'پشتیبانی ۲۴/۷ با مدیر پروژه اختصاصی. پاسخ‌گویی در کمتر از ۲ ساعت و حل مشکلات فوری در اسرع وقت.',
      list:['پشتیبانی ۲۴ ساعته / ۷ روز هفته','پاسخ‌گویی زیر ۲ ساعت','مدیر پروژه اختصاصی'],
      icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>'
    },
    4: {
      title:'نتایج تضمینی',
      desc:'تمام خدمات ما داده‌محور هستند. نتایج واقعی و قابل اندازه‌گیری با ضمانت بازگشت وجه در صورت عدم دستیابی به اهداف توافق‌شده.',
      list:['رویکرد داده‌محور و علمی','نتایج واقعی و قابل اندازه‌گیری','ضمانت بازگشت وجه'],
      icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    }
  };

  // Create dots
  Object.keys(data).forEach((k,i) => {
    const d = document.createElement('button');
    d.className = 'vs-home-why__progress-dot' + (i===0?' is-on':'');
    d.addEventListener('click', () => goTo(parseInt(k)));
    dotsHost.appendChild(d);
  });
  const dots = Array.from(dotsHost.children);

  let current = 1;
  function goTo(n){
    current = n;
    panel.classList.add('is-changing');
    setTimeout(() => {
      const d = data[n];
      panel.querySelector('[data-panel-title]').textContent = d.title;
      panel.querySelector('[data-panel-desc]').textContent = d.desc;
      panel.querySelector('[data-panel-list]').innerHTML = d.list.map(x =>
        '<li><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>' + x + '</li>'
      ).join('');
      panel.querySelector('[data-panel-icon]').innerHTML = d.icon;
      panel.classList.remove('is-changing');
    }, 300);
    tabs.forEach(t => t.classList.toggle('is-active', parseInt(t.dataset.tab) === n));
    dots.forEach((d,i) => d.classList.toggle('is-on', i === n-1));
  }

  tabs.forEach(t => {
    t.addEventListener('click', () => {
      goTo(parseInt(t.dataset.tab));
      clearInterval(auto);
      auto = setInterval(() => goTo(current % 4 + 1), 6000);
    });
  });

  let auto = setInterval(() => goTo(current % 4 + 1), 6000);
})();
</script>
