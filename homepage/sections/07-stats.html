<!-- سکشن ۷: آمار و ارقام - نسخه پیشرفته با حلقه‌های پیشرفت و افکت‌های بصری -->
<style>
.vs-home-stats{
  --vs-primary:#170C79;--vs-secondary:#0170B9;--vs-accent:#128BE0;
  --vs-cyan:#8ACBD0;--vs-cream:#EFE3CA;--vs-ink:#1D2327;
  padding:120px 24px;background:linear-gradient(180deg,#050225 0%,#0a0640 50%,#050225 100%);font-family:'Vazirmatn','IRANSans',Tahoma,sans-serif;direction:rtl;color:#fff;position:relative;overflow:hidden;
}
/* Dot grid background */
.vs-home-stats__dots{position:absolute;inset:0;pointer-events:none;opacity:.3;background-image:radial-gradient(circle,rgba(138,203,208,.3) 1px,transparent 1px);background-size:40px 40px;-webkit-mask-image:radial-gradient(ellipse 60% 50% at 50% 50%,#000,transparent 70%);mask-image:radial-gradient(ellipse 60% 50% at 50% 50%,#000,transparent 70%);animation:vs-stats-dots 20s linear infinite;}
@keyframes vs-stats-dots{to{background-position:40px 40px;}}
.vs-home-stats__inner{max-width:1100px;margin:0 auto;position:relative;}
.vs-home-stats .vs-section-head{text-align:center;margin-bottom:72px;}
.vs-home-stats .vs-section-head .vs-eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.15);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:600;margin-bottom:16px;backdrop-filter:blur(8px);}
.vs-home-stats .vs-section-head .vs-eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--vs-cyan);box-shadow:0 0 0 4px rgba(138,203,208,.25);display:inline-block;}
.vs-home-stats .vs-section-head h2{font-size:clamp(28px,3.4vw,46px);font-weight:800;margin:0;line-height:1.4;}
.vs-home-stats .vs-section-head h2 em{font-style:normal;background:linear-gradient(135deg,var(--vs-cyan),var(--vs-cream));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}
/* Stats grid */
.vs-home-stats__grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;margin-bottom:64px;}
.vs-home-stats__card{text-align:center;position:relative;padding:40px 20px;border-radius:28px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(8px);transition:all .35s ease;}
.vs-home-stats__card:hover{transform:translateY(-4px);border-color:rgba(138,203,208,.25);box-shadow:0 20px 50px rgba(0,0,0,.3);}
/* SVG Ring */
.vs-home-stats__ring{position:relative;width:120px;height:120px;margin:0 auto 20px;}
.vs-home-stats__ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.vs-home-stats__ring-bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:6;}
.vs-home-stats__ring-progress{fill:none;stroke:url(#vs-stats-grad);stroke-width:6;stroke-linecap:round;stroke-dasharray:314;stroke-dashoffset:314;transition:stroke-dashoffset 1.5s cubic-bezier(.4,0,.2,1);}
.vs-home-stats__card:nth-child(2) .vs-home-stats__ring-progress{stroke:url(#vs-stats-grad2);}
.vs-home-stats__card:nth-child(3) .vs-home-stats__ring-progress{stroke:url(#vs-stats-grad3);}
.vs-home-stats__card:nth-child(4) .vs-home-stats__ring-progress{stroke:url(#vs-stats-grad4);}
/* Number */
.vs-home-stats__card-num{font-size:52px;font-weight:900;line-height:1;position:absolute;top:50%;left:50%;transform:translate(-50%,-65%);text-shadow:0 0 30px rgba(138,203,208,.3);}
.vs-home-stats__card-label{font-size:15px;color:rgba(255,255,255,.7);font-weight:600;}
/* Before/After comparison */
.vs-home-stats__compare{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:36px 40px;backdrop-filter:blur(8px);}
.vs-home-stats__compare-title{font-size:18px;font-weight:800;margin-bottom:28px;text-align:center;color:#fff;}
.vs-home-stats__compare-bars{display:grid;gap:20px;}
.vs-home-stats__compare-item{display:grid;grid-template-columns:100px 1fr 60px;gap:16px;align-items:center;}
.vs-home-stats__compare-label{font-size:13px;font-weight:700;color:rgba(255,255,255,.7);}
.vs-home-stats__compare-bar{height:12px;border-radius:6px;background:rgba(255,255,255,.08);position:relative;overflow:hidden;}
.vs-home-stats__compare-bar-fill{position:absolute;inset:0;border-radius:6px;width:0;transition:width 1.5s cubic-bezier(.4,0,.2,1);}
.vs-home-stats__compare-bar-fill--before{background:rgba(255,255,255,.2);}
.vs-home-stats__compare-bar-fill--after{background:linear-gradient(90deg,var(--vs-accent),var(--vs-cyan));}
.vs-home-stats__compare-val{font-size:14px;font-weight:800;color:var(--vs-cyan);text-align:left;}
@media(max-width:880px){.vs-home-stats__grid{grid-template-columns:repeat(2,1fr);}.vs-home-stats__compare-item{grid-template-columns:80px 1fr 50px;}}
@media(max-width:560px){.vs-home-stats__grid{grid-template-columns:1fr;}.vs-home-stats__card-num{font-size:42px;}.vs-home-stats__compare-item{grid-template-columns:1fr;gap:8px;}}
</style>

<section class="vs-home-stats" data-vs-home-stats>
  <div class="vs-home-stats__dots"></div>
  <!-- SVG Gradient definitions -->
  <svg width="0" height="0" style="position:absolute"><defs>
    <linearGradient id="vs-stats-grad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#128BE0"/><stop offset="100%" stop-color="#8ACBD0"/></linearGradient>
    <linearGradient id="vs-stats-grad2" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#128BE0"/></linearGradient>
    <linearGradient id="vs-stats-grad3" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#A855F7"/><stop offset="100%" stop-color="#3DDC84"/></linearGradient>
    <linearGradient id="vs-stats-grad4" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#EFE3CA"/></linearGradient>
  </defs></svg>

  <div class="vs-home-stats__inner">
    <div class="vs-section-head">
      <span class="vs-eyebrow"><i></i>عملکرد ما در اعداد</span>
      <h2>اعدادی که <em>خودشان حرف می‌زنند</em></h2>
    </div>
    <div class="vs-home-stats__grid">
      <div class="vs-home-stats__card">
        <div class="vs-home-stats__ring"><svg viewBox="0 0 108 108"><circle class="vs-home-stats__ring-bg" cx="54" cy="54" r="50"/><circle class="vs-home-stats__ring-progress" cx="54" cy="54" r="50" data-progress="90"/></svg></div>
        <div class="vs-home-stats__card-num" data-count="450" data-suffix="+">۰</div>
        <div class="vs-home-stats__card-label">پروژه موفق</div>
      </div>
      <div class="vs-home-stats__card">
        <div class="vs-home-stats__ring"><svg viewBox="0 0 108 108"><circle class="vs-home-stats__ring-bg" cx="54" cy="54" r="50"/><circle class="vs-home-stats__ring-progress" cx="54" cy="54" r="50" data-progress="75"/></svg></div>
        <div class="vs-home-stats__card-num" data-count="125" data-suffix="+">۰</div>
        <div class="vs-home-stats__card-label">سایت در صفحه اول گوگل</div>
      </div>
      <div class="vs-home-stats__card">
        <div class="vs-home-stats__ring"><svg viewBox="0 0 108 108"><circle class="vs-home-stats__ring-bg" cx="54" cy="54" r="50"/><circle class="vs-home-stats__ring-progress" cx="54" cy="54" r="50" data-progress="85"/></svg></div>
        <div class="vs-home-stats__card-num" data-count="800" data-suffix="+">۰</div>
        <div class="vs-home-stats__card-label">شاگرد آموزش‌دیده</div>
      </div>
      <div class="vs-home-stats__card">
        <div class="vs-home-stats__ring"><svg viewBox="0 0 108 108"><circle class="vs-home-stats__ring-bg" cx="54" cy="54" r="50"/><circle class="vs-home-stats__ring-progress" cx="54" cy="54" r="50" data-progress="95"/></svg></div>
        <div class="vs-home-stats__card-num" data-count="10" data-suffix="+">۰</div>
        <div class="vs-home-stats__card-label">سال تجربه حرفه‌ای</div>
      </div>
    </div>
    <!-- Before/After comparison -->
    <div class="vs-home-stats__compare" data-stats-compare>
      <div class="vs-home-stats__compare-title">میانگین نتایج مشتریان ما</div>
      <div class="vs-home-stats__compare-bars">
        <div class="vs-home-stats__compare-item">
          <div class="vs-home-stats__compare-label">ترافیک ارگانیک</div>
          <div class="vs-home-stats__compare-bar"><div class="vs-home-stats__compare-bar-fill vs-home-stats__compare-bar-fill--after" data-width="85%"></div></div>
          <div class="vs-home-stats__compare-val">+۳۴۰٪</div>
        </div>
        <div class="vs-home-stats__compare-item">
          <div class="vs-home-stats__compare-label">نرخ تبدیل</div>
          <div class="vs-home-stats__compare-bar"><div class="vs-home-stats__compare-bar-fill vs-home-stats__compare-bar-fill--after" data-width="70%"></div></div>
          <div class="vs-home-stats__compare-val">+۱۸۰٪</div>
        </div>
        <div class="vs-home-stats__compare-item">
          <div class="vs-home-stats__compare-label">سرعت سایت</div>
          <div class="vs-home-stats__compare-bar"><div class="vs-home-stats__compare-bar-fill vs-home-stats__compare-bar-fill--after" data-width="92%"></div></div>
          <div class="vs-home-stats__compare-val">+۲۲۰٪</div>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
(function(){
  var section=document.querySelector('[data-vs-home-stats]');
  if(!section)return;
  var toFa=function(n){return String(n).replace(/\d/g,function(d){return'\u06F0\u06F1\u06F2\u06F3\u06F4\u06F5\u06F6\u06F7\u06F8\u06F9'[d];});};
  var cards=section.querySelectorAll('[data-count]');
  var rings=section.querySelectorAll('[data-progress]');
  var bars=section.querySelectorAll('[data-width]');
  var animate=function(el){
    var target=parseInt(el.dataset.count,10);var suffix=el.dataset.suffix||'';var dur=1800;var start=performance.now();
    var step=function(now){var t=Math.min(1,(now-start)/dur);var eased=1-Math.pow(1-t,3);var val=Math.floor(eased*target);el.textContent=toFa(val)+suffix;if(t<1)requestAnimationFrame(step);};
    requestAnimationFrame(step);
  };
  var animateRings=function(){
    rings.forEach(function(ring){var pct=parseInt(ring.dataset.progress,10)/100;var circumference=2*Math.PI*50;ring.style.strokeDasharray=circumference;ring.style.strokeDashoffset=circumference*(1-pct);});
  };
  var animateBars=function(){
    bars.forEach(function(bar){bar.style.width=bar.dataset.width;});
  };
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(e){if(e.isIntersecting){cards.forEach(function(c){animate(c);});animateRings();animateBars();io.unobserve(e.target);}});
  },{threshold:.3});
  io.observe(section);
})();
</script>
